name: Submit shipskip artifact

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task name from '@shipskip/tasks'
        required: true
        default: next-app/software-engineer-portfolio
      model:
        description: OpenRouter model id, for example 'openai/gpt-oss-120b:free'
        required: true
        default: google/gemini-3.1-flash-lite-preview

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.repository.fork || github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHIPSKIP_TASK: ${{ inputs.task }}
      SHIPSKIP_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure session directory
        run: echo "SHIPSKIP_SESSION_DIR=${RUNNER_TEMP}/shipskip" >> "$GITHUB_ENV"

      # Required for shipskip cli and creating manifest.json
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run CLI
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Add API Keys here as needed
        run: |
          bun dev:cli run \
          --task "$SHIPSKIP_TASK" \
          --model "$SHIPSKIP_MODEL"

      - name: Create manifest.json
        shell: bash
        run: |
          set -euo pipefail

          SUBMISSION_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARTIFACT_NAME="artifact-${SUBMISSION_ID}"

          SUBMISSION_MODEL="${SHIPSKIP_MODEL%%:*}"

          jq -n \
          --arg id "$SUBMISSION_ID" \
          --arg model "$SUBMISSION_MODEL" \
          --arg task "$SHIPSKIP_TASK" \
          --argjson run_id "$GITHUB_RUN_ID" \
          --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg artifact_name "$ARTIFACT_NAME" \
          --arg submitter "$GITHUB_ACTOR" \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg source_sha "$GITHUB_SHA" \
          --arg ref "$GITHUB_REF_NAME" \
          '{
            id: $id,
            model: $model,
            task: $task,
            run_id: $run_id,
            run_attempt: $run_attempt,
            run_url: $run_url,
            artifact_name: $artifact_name,
            submitter: $submitter,
            repo: $repo,
            source_sha: $source_sha,
            ref: $ref
          }' > manifest.json

      - name: Stage artifact files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact
          cp -R "$SHIPSKIP_SESSION_DIR/build" artifact/build
          cp "$SHIPSKIP_SESSION_DIR/app.tar.gz" artifact/app.tar.gz
          cp "$SHIPSKIP_SESSION_DIR/logs.ndjson" artifact/logs.ndjson
          cp manifest.json artifact/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true
          retention-days: 30
          path: artifact/*

      - name: Commit submission record
        shell: bash
        run: |
          set -euo pipefail

          jq -c . manifest.json >> submissions.jsonl
          git add submissions.jsonl
          git commit -m "Submission for $SHIPSKIP_TASK" || exit 0
          git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs
          if-no-files-found: ignore
          path: ${{ env.SHIPSKIP_SESSION_DIR }}/logs.ndjson

      - name: Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "## Submission ready"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Task | \`$SHIPSKIP_TASK\` |"
            echo "| Model | \`$SHIPSKIP_MODEL\` |"
            echo "| Submitter | \`$GITHUB_ACTOR\` |"
            echo "| Source ref | \`$GITHUB_REF_NAME\` |"
            echo "| Source SHA | \`$GITHUB_SHA\` |"
            echo "| Run | [$GITHUB_RUN_ID]($RUN_URL) |"
            echo "| Artifact | [artifact]($RUN_URL#artifacts) |"
          } >> "$GITHUB_STEP_SUMMARY"
