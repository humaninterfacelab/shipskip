name: Submit shipskip task artifact

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task name from '@shipskip/tasks'
        required: true
        default: next-app/saas-landing-page
      model:
        description: Model profile, for example 'openrouter/openai/gpt-oss-120b:free'
        required: true
        default: google/gemini-3.1-flash-lite-preview#low

permissions:
  contents: write

jobs:
  generate:
    name: Generate shipskip task artifact
    if: ${{ github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHIPSKIP_TASK: ${{ inputs.task }}
      SHIPSKIP_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure session directory
        run: echo "SHIPSKIP_SESSION_DIR=${RUNNER_TEMP}/shipskip" >> "$GITHUB_ENV"

      # Required for shipskip cli and creating manifest.json
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run CLI
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Add API Keys here as needed
        run: |
          bun dev:cli run \
          --task "$SHIPSKIP_TASK" \
          --model "$SHIPSKIP_MODEL"

      - name: Create manifest.json
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
          --arg model "$SHIPSKIP_MODEL" \
          --arg task "$SHIPSKIP_TASK" \
          --arg run_id "$GITHUB_RUN_ID" \
          --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg submitter "$GITHUB_ACTOR" \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg sha "$GITHUB_SHA" \
          --arg ref "$GITHUB_REF_NAME" \
          '{
            model: $model,
            task: $task,
            run_id: $run_id,
            run_attempt: $run_attempt,
            run_url: $run_url,
            submitter: $submitter,
            repo: $repo,
            sha: $sha,
            ref: $ref
          }' > manifest.json

      - name: Stage artifact files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact
          cp -R "$SHIPSKIP_SESSION_DIR/build" artifact/build
          cp "$SHIPSKIP_SESSION_DIR/app.tar.gz" artifact/app.tar.gz
          cp "$SHIPSKIP_SESSION_DIR/logs.ndjson" artifact/logs.ndjson
          cp manifest.json artifact/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          overwrite: true
          path: artifact/*

      - name: Commit manifest.json
        shell: bash
        run: |
          git add manifest.json
          git commit -m "Add manifest.json" || exit 0
          git push
