name: Apply shipskip publish result

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      ${{
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        contains(github.event.pull_request.labels.*.name, 'publish')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.BOT_PAT || github.token }}
          fetch-depth: 0

      - name: Read publish result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          RESULT_BRANCH="shipskip-publish/pr-${PR_NUMBER}"
          RESULT_FILE=".shipskip/publish-results/pr-${PR_NUMBER}.json"

          git fetch origin "${RESULT_BRANCH}:${RESULT_BRANCH}"

          git show "${RESULT_BRANCH}:${RESULT_FILE}" > publish-result.json

          jq -e \
            --argjson pr_number "$PR_NUMBER" \
            --arg source_repo "$HEAD_REPO" '
              .pr_number == $pr_number and
              .source_repo == $source_repo and
              (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.submission_id | type == "string" and test("^[a-z0-9][a-z0-9-]{0,62}$")) and
              (.pages_url | type == "string" and startswith("https://")) and
              (.r2_url | type == "string" and startswith("r2://"))
            ' publish-result.json > /dev/null

          {
            echo "submission_id=$(jq -r '.submission_id' publish-result.json)"
            echo "source_sha=$(jq -r '.source_sha' publish-result.json)"
            echo "pages_url=$(jq -r '.pages_url' publish-result.json)"
            echo "r2_url=$(jq -r '.r2_url' publish-result.json)"
            echo "result_branch=$RESULT_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Update submission record on default branch
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.result.outputs.submission_id }}
          SOURCE_SHA: ${{ steps.result.outputs.source_sha }}
          PAGES_URL: ${{ steps.result.outputs.pages_url }}
          R2_URL: ${{ steps.result.outputs.r2_url }}
        run: |
          set -euo pipefail

          test -f submissions.jsonl

          MATCHES=$(
            jq -r --arg id "$SUBMISSION_ID" --arg repo "$HEAD_REPO" --arg sha "$SOURCE_SHA" '
              select(.id == $id and .repo == $repo and .source_sha == $sha) | .id
            ' submissions.jsonl | wc -l
          )

          if [[ "$MATCHES" -ne 1 ]]; then
            echo "Expected exactly one matching submission record; found ${MATCHES}." >&2
            exit 1
          fi

          jq -c \
            --arg id "$SUBMISSION_ID" \
            --arg repo "$HEAD_REPO" \
            --arg sha "$SOURCE_SHA" \
            --arg pages_url "$PAGES_URL" \
            --arg r2_url "$R2_URL" \
            'if .id == $id and .repo == $repo and .source_sha == $sha then . + {pages_url: $pages_url, r2_url: $r2_url} else . end' \
            submissions.jsonl > tmp.jsonl

          mv tmp.jsonl submissions.jsonl

      - name: Commit update to default branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add submissions.jsonl

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add publish URLs for ${{ steps.result.outputs.submission_id }}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Delete publish result branch
        if: ${{ success() }}
        shell: bash
        env:
          RESULT_BRANCH: ${{ steps.result.outputs.result_branch }}
        run: |
          set -euo pipefail
          git push origin --delete "$RESULT_BRANCH" || true
