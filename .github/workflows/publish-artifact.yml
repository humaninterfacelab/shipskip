name: Publish shipskip artifact

on:
  workflow_dispatch:
    inputs:
      manifest_sha:
        description: Commit SHA that created manifest.json
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANIFEST_SHA: ${{ inputs.manifest_sha }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MANIFEST_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Parse manifest.json
        shell: bash
        run: |
          set -euo pipefail

          MODEL=$(jq -er '.model' manifest.json)
          TASK=$(jq -er '.task' manifest.json)
          RUN_ID=$(jq -er '.run_id | tostring' manifest.json)
          REPO=$(jq -er '.repo' manifest.json)
          SOURCE_SHA=$(jq -er '.sha' manifest.json)

          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "TASK=$TASK" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate source workflow run
        id: validate-source-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_metadata=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")

          jq -e '
            .head_sha == env.SOURCE_SHA and
            .name == "Submit shipskip artifact" and
            .event == "workflow_dispatch" and
            .conclusion == "success"
          ' <<< "$run_metadata" > /dev/null

          PR_NUMBER=$(jq -er '.pull_requests[0].number | tostring' <<< "$run_metadata")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download artifact from public repo
        uses: actions/download-artifact@v8
        with:
          repository: ${{ env.REPO }}
          run-id: ${{ env.RUN_ID }}
          name: artifact
          github-token: ${{ github.token }}
          path: ./artifact

      - name: Deploy static website
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./artifact/build --project-name=${{ env.PAGES_PROJECT_NAME }} --branch=${{ env.MANIFEST_SHA }} --commit-dirty=true

      - name: Upload to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            r2 object put shipskip-artifacts/${{ env.MANIFEST_SHA }}/manifest.json --file ./artifact/manifest.json
            r2 object put shipskip-artifacts/${{ env.MANIFEST_SHA }}/logs.ndjson --file ./artifact/logs.ndjson
            r2 object put shipskip-artifacts/${{ env.MANIFEST_SHA }}/app.tar.gz --file ./artifact/app.tar.gz

      - name: Close source pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate-source-run.outputs.pr_number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$REPO" \
            --comment "🎉 Thanks for your submission! It has been published. This PR will be closed without merging."
