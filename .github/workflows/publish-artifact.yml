name: Publish shipskip artifact

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number containing the reviewed submission
        required: true
      submission_sha:
        description: Exact PR commit SHA that was reviewed
        required: true
      submission_path:
        description: Path to the reviewed submission directory, for example submissions/task/template/user/run-attempt
        required: true

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify and build reviewed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PR_NUMBER: ${{ inputs.pull_request }}
      SUBMISSION_SHA: ${{ inputs.submission_sha }}
      SUBMISSION_PATH: ${{ inputs.submission_path }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "::error::pull_request must be a number."
            exit 1
          }

          [[ "$SUBMISSION_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo "::error::submission_sha must be a full 40-character Git SHA."
            exit 1
          }

          [[ "$SUBMISSION_PATH" =~ ^submissions/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::submission_path must be submissions/<task>/<template>/<user>/<run-attempt> with safe path segments."
            exit 1
          }

      - name: Checkout reviewed PR commit
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ inputs.pull_request }}/head
          persist-credentials: false

      - name: Verify reviewed commit SHA
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [ "$actual_sha" != "$SUBMISSION_SHA" ]; then
            echo "::error::PR head changed after review. Expected $SUBMISSION_SHA, got $actual_sha."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest_path="$SUBMISSION_PATH/manifest.json"
          source_path="$SUBMISSION_PATH/source"
          log_path="$SUBMISSION_PATH/session.log"

          test -f "$manifest_path" || {
            echo "::error::Manifest not found: $manifest_path"
            exit 1
          }

          test -d "$source_path" || {
            echo "::error::Submission source not found: $source_path"
            exit 1
          }

          test -f "$source_path/build.sh" || {
            echo "::error::Submission source is missing build.sh: $source_path/build.sh"
            exit 1
          }

          test -f "$log_path" || {
            echo "::error::Submission log not found: $log_path"
            exit 1
          }

          {
            echo "SHIPSKIP_MANIFEST_PATH=$manifest_path"
            echo "SHIPSKIP_SOURCE_PATH=$source_path"
            echo "SHIPSKIP_LOG_PATH=$log_path"
          } >> "$GITHUB_ENV"

      - name: Build reviewed source
        shell: bash
        run: |
          set -euo pipefail

          build_source_path="$RUNNER_TEMP/shipskip-build-source"
          build_output_path="$RUNNER_TEMP/shipskip-build-output"

          rm -rf "$build_source_path"
          rm -rf "$build_output_path"

          mkdir -p "$build_source_path"
          mkdir -p "$RUNNER_TEMP/shipskip-home"
          cp -a "$SHIPSKIP_SOURCE_PATH/." "$build_source_path/"

          env -i \
            HOME="$RUNNER_TEMP/shipskip-home" \
            PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            bash "$build_source_path/build.sh" "$build_output_path"

          echo "SHIPSKIP_BUILD_OUTPUT_PATH=$build_output_path" >> "$GITHUB_ENV"

      - name: Compute digests
        shell: bash
        run: |
          set -euo pipefail

          test -d "$SHIPSKIP_BUILD_OUTPUT_PATH" || {
            echo "::error::Build did not create output directory: $SHIPSKIP_BUILD_OUTPUT_PATH"
            exit 1
          }

          if ! find "$SHIPSKIP_BUILD_OUTPUT_PATH" -type f -print -quit | grep -q .; then
            echo "::error::Build output is empty"
            exit 1
          fi

          build_digest_file="$RUNNER_TEMP/shipskip-build-output.sha256sum"
          source_digest_file="$RUNNER_TEMP/shipskip-source.sha256sum"

          (
            cd "$SHIPSKIP_BUILD_OUTPUT_PATH"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$build_digest_file"

          (
            cd "$SHIPSKIP_SOURCE_PATH"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$source_digest_file"

          build_digest="$(sha256sum "$build_digest_file" | cut -d ' ' -f 1)"
          source_digest="$(sha256sum "$source_digest_file" | cut -d ' ' -f 1)"
          log_digest="$(sha256sum "$SHIPSKIP_LOG_PATH" | cut -d ' ' -f 1)"

          {
            echo "SHIPSKIP_BUILD_DIGEST_FILE=$build_digest_file"
            echo "SHIPSKIP_SOURCE_DIGEST_FILE=$source_digest_file"
            echo "SHIPSKIP_BUILD_DIGEST=$build_digest"
            echo "SHIPSKIP_SOURCE_DIGEST=$source_digest"
            echo "SHIPSKIP_LOG_DIGEST=$log_digest"
          } >> "$GITHUB_ENV"

      - name: Package verified artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_path="$RUNNER_TEMP/shipskip-verified-artifact"
          rm -rf "$artifact_path"
          mkdir -p "$artifact_path/source" "$artifact_path/site"

          cp -a "$SHIPSKIP_SOURCE_PATH/." "$artifact_path/source/"
          cp -a "$SHIPSKIP_BUILD_OUTPUT_PATH/." "$artifact_path/site/"
          cp "$SHIPSKIP_LOG_PATH" "$artifact_path/session.log"
          cp "$SHIPSKIP_MANIFEST_PATH" "$artifact_path/manifest.json"
          cp "$SHIPSKIP_BUILD_DIGEST_FILE" "$artifact_path/build-output.sha256sum"
          cp "$SHIPSKIP_SOURCE_DIGEST_FILE" "$artifact_path/source.sha256sum"

          jq -n \
            --arg buildDigest "$SHIPSKIP_BUILD_DIGEST" \
            --arg sourceDigest "$SHIPSKIP_SOURCE_DIGEST" \
            --arg logDigest "$SHIPSKIP_LOG_DIGEST" \
            '{ buildDigest: $buildDigest, sourceDigest: $sourceDigest, logDigest: $logDigest }' \
            > "$artifact_path/digests.json"

          echo "SHIPSKIP_ARTIFACT_PATH=$artifact_path" >> "$GITHUB_ENV"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipskip-verified-artifact
          path: ${{ runner.temp }}/shipskip-verified-artifact
          if-no-files-found: error

  publish:
    name: Publish verified artifact
    runs-on: ubuntu-latest
    needs: verify-build
    timeout-minutes: 15
    environment: artifact-publish
    permissions:
      contents: write

    env:
      PR_NUMBER: ${{ inputs.pull_request }}
      SUBMISSION_SHA: ${{ inputs.submission_sha }}
      SUBMISSION_PATH: ${{ inputs.submission_path }}

    steps:
      - name: Checkout default branch for credit record
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: shipskip-verified-artifact
          path: ${{ runner.temp }}/shipskip-verified-artifact

      - name: Publish to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail

          : "${R2_ACCOUNT_ID:?Missing R2_ACCOUNT_ID}"
          : "${R2_BUCKET:?Missing R2_BUCKET}"

          artifact_path="$RUNNER_TEMP/shipskip-verified-artifact"
          source_path="$artifact_path/source"
          site_path="$artifact_path/site"
          log_path="$artifact_path/session.log"
          manifest_path="$artifact_path/manifest.json"
          digests_path="$artifact_path/digests.json"

          build_digest="$(jq -r '.buildDigest' "$digests_path")"
          source_digest="$(jq -r '.sourceDigest' "$digests_path")"
          log_digest="$(jq -r '.logDigest' "$digests_path")"

          endpoint_url="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          publish_manifest="$RUNNER_TEMP/shipskip-publish-manifest.json"

          jq \
            --arg publishedBy "${{ github.actor }}" \
            --arg publishRunId "${{ github.run_id }}" \
            --arg sourcePullRequest "$PR_NUMBER" \
            --arg sourceSubmissionSha "$SUBMISSION_SHA" \
            --arg buildDigest "sha256:$build_digest" \
            --arg sourceDigest "sha256:$source_digest" \
            --arg logDigest "sha256:$log_digest" \
            '. + {
              publishedBy: $publishedBy,
              publishRunId: $publishRunId,
              sourcePullRequest: $sourcePullRequest,
              sourceSubmissionSha: $sourceSubmissionSha,
              buildDigest: $buildDigest,
              sourceDigest: $sourceDigest,
              logDigest: $logDigest
            }' \
            "$manifest_path" > "$publish_manifest"

          aws s3 sync "$source_path" "s3://$R2_BUCKET/$SUBMISSION_PATH/source" --endpoint-url "$endpoint_url" --delete --only-show-errors
          aws s3 sync "$site_path" "s3://$R2_BUCKET/$SUBMISSION_PATH/site" --endpoint-url "$endpoint_url" --delete --only-show-errors
          aws s3 cp "$log_path" "s3://$R2_BUCKET/$SUBMISSION_PATH/session.log" --endpoint-url "$endpoint_url" --only-show-errors
          aws s3 cp "$artifact_path/build-output.sha256sum" "s3://$R2_BUCKET/$SUBMISSION_PATH/build-output.sha256sum" --endpoint-url "$endpoint_url" --only-show-errors
          aws s3 cp "$artifact_path/source.sha256sum" "s3://$R2_BUCKET/$SUBMISSION_PATH/source.sha256sum" --endpoint-url "$endpoint_url" --only-show-errors
          aws s3 cp "$publish_manifest" "s3://$R2_BUCKET/$SUBMISSION_PATH/manifest.json" --endpoint-url "$endpoint_url" --only-show-errors

          echo "SHIPSKIP_PUBLISH_MANIFEST=$publish_manifest" >> "$GITHUB_ENV"
          echo "SHIPSKIP_BUILD_DIGEST=$build_digest" >> "$GITHUB_ENV"
          echo "SHIPSKIP_SOURCE_DIGEST=$source_digest" >> "$GITHUB_ENV"
          echo "SHIPSKIP_LOG_DIGEST=$log_digest" >> "$GITHUB_ENV"

      - name: Record publish credit
        shell: bash
        run: |
          set -euo pipefail

          submitted_by="$(jq -r '.submittedBy' "$SHIPSKIP_PUBLISH_MANIFEST")"
          task="$(jq -r '.task' "$SHIPSKIP_PUBLISH_MANIFEST")"
          template="$(jq -r '.template' "$SHIPSKIP_PUBLISH_MANIFEST")"

          test -n "$submitted_by" && test "$submitted_by" != "null" || {
            echo "::error::Publish manifest is missing submittedBy."
            exit 1
          }

          credit_path="published-submissions/pr-$PR_NUMBER/$SUBMISSION_SHA.json"
          echo "SHIPSKIP_CREDIT_PATH=$credit_path" >> "$GITHUB_ENV"

          mkdir -p "$(dirname "$credit_path")"
          cp "$SHIPSKIP_PUBLISH_MANIFEST" "$credit_path"

          git add "$credit_path"

          if git diff --cached --quiet; then
            echo "Publish credit already recorded at $credit_path."
            exit 0
          fi

          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Credit shipskip submission $task/$template by $submitted_by"

          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## shipskip site published"
            echo ""
            echo "- Pull request: \`#$PR_NUMBER\`"
            echo "- Submission SHA: \`$SUBMISSION_SHA\`"
            echo "- Submission path: \`$SUBMISSION_PATH\`"
            echo "- Credit record: \`$SHIPSKIP_CREDIT_PATH\`"
            echo "- Build digest: \`sha256:$SHIPSKIP_BUILD_DIGEST\`"
            echo "- Source digest: \`sha256:$SHIPSKIP_SOURCE_DIGEST\`"
            echo "- Log digest: \`sha256:$SHIPSKIP_LOG_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
