name: Publish shipskip artifact

on:
  pull_request_target:
    types:
      - labeled

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    if: ${{ github.event.label.name == 'publish' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      R2_BUCKET_NAME: shipskip-artifacts
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Validate PR shape
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" > pr-files.json

          jq -e '
            length == 1 and
            .[0].filename == "submissions.jsonl" and
            .[0].status == "modified" and
            .[0].additions >= 1 and
            .[0].deletions == 0
          ' pr-files.json > /dev/null

      - name: Checkout base submission file
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: submissions.jsonl
          sparse-checkout-cone-mode: false

      - name: Checkout head submission file
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
          sparse-checkout: submissions.jsonl
          sparse-checkout-cone-mode: false

      - name: Extract and validate submissions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_FILE="base/submissions.jsonl"
          HEAD_FILE="head/submissions.jsonl"

          test -f "$BASE_FILE"
          test -f "$HEAD_FILE"

          BASE_LINES=$(wc -l < "$BASE_FILE" | tr -d ' ')
          HEAD_LINES=$(wc -l < "$HEAD_FILE" | tr -d ' ')

          if [[ "$HEAD_LINES" -le "$BASE_LINES" ]]; then
            echo "Expected submissions.jsonl to append at least one record." >&2
            exit 1
          fi

          if ! cmp -s "$BASE_FILE" <(head -n "$BASE_LINES" "$HEAD_FILE"); then
            echo "submissions.jsonl must preserve all existing records and append new records only." >&2
            exit 1
          fi

          tail -n +$((BASE_LINES + 1)) "$HEAD_FILE" > submissions-to-publish.jsonl

          ADDITIONS=$(jq -r '.[0].additions' pr-files.json)
          RECORDS=$(wc -l < submissions-to-publish.jsonl | tr -d ' ')

          if [[ "$RECORDS" -ne "$ADDITIONS" ]]; then
            echo "Expected ${ADDITIONS} new submission records in the diff; found ${RECORDS}." >&2
            exit 1
          fi

          jq -s -e '
            all(.[];
              type == "object" and
              (.id | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
              (.artifact_name == ("artifact-" + .id)) and
              (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and
              ((.run_id | type) == "number" and .run_id > 0 and (.run_id | floor) == .run_id) and
              ((.run_attempt | type) == "number" and .run_attempt > 0 and (.run_attempt | floor) == .run_attempt)
            )
          ' submissions-to-publish.jsonl > /dev/null

          IDS=$(jq -r '.id' submissions-to-publish.jsonl | sort | uniq -d)
          if [[ -n "$IDS" ]]; then
            echo "Submission ids must be unique within the PR." >&2
            echo "$IDS" >&2
            exit 1
          fi

          EXISTING_IDS=$(jq -n -r --slurpfile base "$BASE_FILE" --slurpfile new submissions-to-publish.jsonl '
            ($base | map(.id)) as $base_ids |
            $new[] | .id as $id | select($base_ids | index($id)) | $id
          ' | sort -u)
          if [[ -n "$EXISTING_IDS" ]]; then
            echo "Submission ids must not already exist in the base file." >&2
            echo "$EXISTING_IDS" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Publish submissions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_READER_TOKEN || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          : > publish-results.jsonl

          while IFS= read -r submission; do
            jq -c . <<< "$submission" > submission.json

            SUBMISSION_ID=$(jq -r '.id' submission.json)
            RUN_ID=$(jq -r '.run_id' submission.json)
            RUN_ATTEMPT=$(jq -r '.run_attempt' submission.json)
            SOURCE_SHA=$(jq -r '.source_sha' submission.json)
            ARTIFACT_NAME=$(jq -r '.artifact_name' submission.json)
            ARTIFACT_DIR="./artifacts/${SUBMISSION_ID}"

            echo "Publishing submission ${SUBMISSION_ID} from run ${RUN_ID} in ${HEAD_REPO}."

            if ! gh api "repos/${HEAD_REPO}/actions/runs/${RUN_ID}" > run.json; then
              echo "Failed to read workflow run ${RUN_ID} from ${HEAD_REPO}." >&2
              exit 1
            fi

            rm -rf "$ARTIFACT_DIR"
            mkdir -p "$ARTIFACT_DIR"
            if ! gh run download "$RUN_ID" --repo "$HEAD_REPO" --name "$ARTIFACT_NAME" --dir "$ARTIFACT_DIR"; then
              echo "Failed to download artifact ${ARTIFACT_NAME} from run ${RUN_ID}." >&2
              exit 1
            fi

            for file in manifest.json logs.ndjson app.tar.gz; do
              if [[ ! -f "${ARTIFACT_DIR}/${file}" ]]; then
                echo "Downloaded artifact is missing ${file}." >&2
                exit 1
              fi
            done

            if [[ ! -d "${ARTIFACT_DIR}/build" ]]; then
              echo "Downloaded artifact is missing build/." >&2
              exit 1
            fi

            if ! jq -e --slurpfile sub submission.json '
              .id == $sub[0].id and
              .artifact_name == $sub[0].artifact_name and
              .run_id == $sub[0].run_id and
              .source_sha == $sub[0].source_sha
            ' "${ARTIFACT_DIR}/manifest.json" > /dev/null; then
              echo "Downloaded manifest does not match the submission record." >&2
              exit 1
            fi

            npx --yes wrangler@latest pages deploy "${ARTIFACT_DIR}/build" \
              --project-name="${PAGES_PROJECT_NAME}" \
              --branch="${SUBMISSION_ID}" \
              --commit-dirty=true

            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${SUBMISSION_ID}/manifest.json" --file "${ARTIFACT_DIR}/manifest.json"
            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${SUBMISSION_ID}/logs.ndjson" --file "${ARTIFACT_DIR}/logs.ndjson"
            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${SUBMISSION_ID}/app.tar.gz" --file "${ARTIFACT_DIR}/app.tar.gz"

            jq -n -c \
              --argjson pr_number "$PR_NUMBER" \
              --arg pr_url "$PR_URL" \
              --arg submission_id "$SUBMISSION_ID" \
              --arg source_repo "$HEAD_REPO" \
              --arg source_sha "$SOURCE_SHA" \
              --arg run_id "$RUN_ID" \
              --arg run_attempt "$RUN_ATTEMPT" \
              --arg pages_url "https://${SUBMISSION_ID}.${PAGES_PROJECT_NAME}.pages.dev" \
              --arg r2_url "r2://${R2_BUCKET_NAME}/${SUBMISSION_ID}" \
              --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                pr_number: $pr_number,
                pr_url: $pr_url,
                submission_id: $submission_id,
                source_repo: $source_repo,
                source_sha: $source_sha,
                run_id: ($run_id | tonumber),
                run_attempt: ($run_attempt | tonumber),
                pages_url: $pages_url,
                r2_url: $r2_url,
                published_at: $published_at
              }' >> publish-results.jsonl
          done < submissions-to-publish.jsonl

          jq -s -c . publish-results.jsonl > publish-results.json
          cp publish-results.json "$RUNNER_TEMP/publish-results.json"

      - name: Comment publish URLs on PR
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "## Publish succeeded"
            echo
            echo "| Submission | Pages | Artifact |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| `\(.submission_id)` | [Preview](\(.pages_url)) | `\(.r2_url)` |"' "$RUNNER_TEMP/publish-results.json"
          } > publish-comment.md

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file publish-comment.md
